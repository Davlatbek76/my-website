name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # 🧪 JOB 1: TEST
  # ==========================================
  test:
    name: 🧪 Testlar
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v4
      
      - name: 🐍 Python 3.11 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: ✅ Testlarni bajarish
        run: pytest tests/ -v

  # ==========================================
  # 🐳 JOB 2: BUILD
  # ==========================================
  build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v4
      
      - name: 🐳 Docker Buildx o'rnatish
        uses: docker/setup-buildx-action@v3
      
      - name: 🏗️ Image qurish
        run: docker build -t my-website:${{ github.sha }} .
      
      - name: ✅ Build muvaffaqiyatli
        run: echo "Docker image qurildi!"

  # ==========================================
  # 🚀 JOB 3: DEPLOY
  # ==========================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v4
      
      - name: ✅ Deploy tayyor
        run: |
          echo "=========================================="
          echo "🎉 CI/CD MUVAFFAQIYATLI YAKUNLANDI!"
          echo "=========================================="
          echo "📦 Commit: ${{ github.sha }}"
          echo "👤 Muallif: ${{ github.actor }}"
          echo "⏰ Vaqt: $(date)"
          echo "=========================================="

