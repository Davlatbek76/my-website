<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        p {
            font-size: 1.2rem;
            opacity: 0.95;
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            font-size: 0.9rem;
            margin: 5px;
        }
        .status {
            margin-top: 30px;
            padding: 15px 30px;
            background: rgba(76, 175, 80, 0.3);
            border: 2px solid #4CAF50;
            border-radius: 10px;
            font-weight: bold;
        }
        .version {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 193, 7, 0.3);
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 {{ title }} v2.0</h1>
        <p>Bu sayt avtomatik CI/CD orqali deploy qilindi!</p>
        
        <div>
            <span class="badge">🐳 Docker</span>
            <span class="badge">⚙️ GitHub Actions</span>
            <span class="badge">🐍 Flask</span>
        </div>
        
        <div class="status">
            ✅ CI/CD muvaffaqiyatli ishlayapti!
        </div>
        
        <div class="version">
            🎉 Yangi versiya 2.0 muvaffaqiyatli deploy qilindi!
        </div>
    </div>
</body>
</html>
